name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven:
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp clean verify
      - if: matrix.java == 21
        run: java -jar peppol-lab-cli/target/peppol-lab.jar run --output target/ci-reports
      - if: always() && matrix.java == 21
        uses: actions/upload-artifact@v7
        with:
          name: peppol-lab-reports
          path: target/ci-reports
