name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and verify release
        env:
          LAB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mvn -B -ntp -Drevision="$LAB_VERSION" clean verify
          java -jar peppol-lab-cli/target/peppol-lab.jar --version \
            | grep -Fx "peppol-lab $LAB_VERSION"
          grep -Fq '"toolVersion" : "'"$LAB_VERSION"'"' \
            peppol-lab-cli/target/smoke-report/results.json

      - name: Verify reproducible JAR
        env:
          LAB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp peppol-lab-cli/target/peppol-lab.jar "$RUNNER_TEMP/peppol-lab-first.jar"
          mvn -B -ntp -Drevision="$LAB_VERSION" -DskipTests clean package
          cmp "$RUNNER_TEMP/peppol-lab-first.jar" peppol-lab-cli/target/peppol-lab.jar

      - name: Assemble release assets
        env:
          LAB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p target/release
          cp peppol-lab-cli/target/peppol-lab.jar \
            "target/release/peppol-lab-$LAB_VERSION.jar"
          cp peppol-lab-cli/src/main/resources/schema/scenario-v1alpha1.schema.json \
            target/release/scenario-v1alpha1.schema.json
          cd target/release
          sha256sum "peppol-lab-$LAB_VERSION.jar" scenario-v1alpha1.schema.json > SHA256SUMS

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: LAB_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/* \
            --verify-tag \
            --generate-notes \
            --title "Peppol Interop Lab $LAB_VERSION"
