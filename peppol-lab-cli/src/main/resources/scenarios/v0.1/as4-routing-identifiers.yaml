apiVersion: peppol-interop-lab/v1alpha1
kind: Scenario
metadata:
  name: as4-routing-identifiers
  description: Verifies Peppol party, document, process, and message-property identifiers observed by the receiver
  tags: [as4, positive, routing, evidence]
specifications: { smp: "1.4.0", as4: "2.0.3", sbdh: "2.0.2" }
requires: [AS4_SEND, EVIDENCE]
steps:
  - id: transmit-and-observe-routing
    target: as4-fixture
    action: as4.send
    with:
      messageId: routing-001@interop-lab
      sender: POP000111
      receiver: POP000222
      documentType: urn:example:documents:invoice:1
      process: urn:example:processes:billing:1
      originalSender: 9915:original-sender
      finalRecipient: 0208:final-recipient
    expect:
      status: 200
      outcome: SUCCESS
      contains:
        - fromPartyId=POP000111
        - toPartyId=POP000222
        - documentType=urn:example:documents:invoice:1
        - process=urn:example:processes:billing:1
        - originalSender=9915:original-sender
        - finalRecipient=0208:final-recipient
