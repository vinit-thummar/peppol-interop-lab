apiVersion: peppol-interop-lab/v1alpha1
kind: Scenario
metadata:
  name: smp-invalid-metadata
  description: Rejects a successful HTTP response whose SMP metadata is not well-formed XML
  tags: [smp, negative, malformed, metadata]
specifications: { smp: "1.4.0", as4: "2.0.3", sbdh: "2.0.2" }
requires: [SMP_LOOKUP]
steps:
  - id: lookup-malformed-metadata
    target: smp-fixture
    action: smp.get
    with: { path: "/iso6523-actorid-upis::9915:receiver/services/invoice?mode=malformed" }
    expect:
      status: 200
      outcome: INVALID_METADATA
      contains: [Malformed SMP XML]
