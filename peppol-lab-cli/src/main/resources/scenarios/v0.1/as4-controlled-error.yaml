apiVersion: peppol-interop-lab/v1alpha1
kind: Scenario
metadata:
  name: as4-controlled-http-error
  description: Preserves an AS4 peer failure as an observable failed exchange
  tags: [as4, negative, resilience]
specifications: { smp: "1.4.0", as4: "2.0.3", sbdh: "2.0.2" }
requires: [AS4_SEND]
steps:
  - id: transmit-to-failing-peer
    target: as4-fixture
    action: as4.send
    with: { path: "/as4/accept?mode=error", messageId: "failure-001@interop-lab" }
    expect:
      status: 500
      outcome: HTTP_ERROR
      contains: ["EBMS:0004", controlled failure]
