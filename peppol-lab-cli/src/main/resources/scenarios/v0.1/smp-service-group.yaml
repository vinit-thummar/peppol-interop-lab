apiVersion: peppol-interop-lab/v1alpha1
kind: Scenario
metadata:
  name: smp-service-group
  description: Returns the requested participant service group
  tags: [smp, positive]
specifications: { smp: "1.4.0", as4: "2.0.3", sbdh: "2.0.2" }
requires: [SMP_LOOKUP]
steps:
  - id: lookup-service-group
    target: smp-fixture
    action: smp.get
    with: { path: "/iso6523-actorid-upis::9915:receiver" }
    expect:
      status: 200
      outcome: SUCCESS
      contains: [ServiceGroup, "9915:receiver", ServiceMetadataReference]
      headers: { Content-Type: application/xml }
      maxDurationMs: 1000
