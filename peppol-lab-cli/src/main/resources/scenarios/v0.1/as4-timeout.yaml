apiVersion: peppol-interop-lab/v1alpha1
kind: Scenario
metadata:
  name: as4-controlled-timeout
  description: Distinguishes a bounded AS4 response timeout from a protocol or HTTP failure
  tags: [as4, negative, resilience, timeout]
specifications: { smp: "1.4.0", as4: "2.0.3", sbdh: "2.0.2" }
requires: [AS4_SEND]
steps:
  - id: transmit-to-slow-peer
    target: as4-fixture
    action: as4.send
    with:
      path: /as4/accept?mode=slow
      messageId: timeout-001@interop-lab
      timeoutMs: 50
    expect:
      outcome: TIMEOUT
      maxDurationMs: 1000
