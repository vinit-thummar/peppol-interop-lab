apiVersion: peppol-interop-lab/v1alpha1
kind: Scenario
metadata:
  name: smp-controlled-timeout
  description: Distinguishes a bounded SMP timeout from an HTTP contract failure
  tags: [smp, resilience, timeout]
specifications: { smp: "1.4.0", as4: "2.0.3", sbdh: "2.0.2" }
requires: [SMP_LOOKUP]
steps:
  - id: timed-lookup
    target: smp-fixture
    action: smp.get
    with: { path: "/iso6523-actorid-upis::9915:receiver?mode=slow", timeoutMs: 50 }
    expect:
      outcome: TIMEOUT
      maxDurationMs: 500
