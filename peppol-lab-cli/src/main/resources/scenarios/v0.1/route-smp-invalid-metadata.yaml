apiVersion: peppol-interop-lab/v1alpha1
kind: Scenario
metadata:
  name: route-smp-invalid-metadata
  description: Discovers the SMP but blocks delivery when service metadata is malformed
  tags: [dns, smp, negative, route-proof]
specifications: { smp: "1.4.0", as4: "2.0.3", sbdh: "2.0.2" }
requires: [DNS_LOOKUP, SMP_LOOKUP, EVIDENCE]
steps:
  - id: discover-smp
    target: dns-fixture
    action: dns.lookup
    with: { name: ok.sml.test, type: NAPTR }
    expect: { status: 0, outcome: SUCCESS }
  - id: retrieve-metadata
    target: smp-fixture
    action: smp.get
    with:
      baseUrl: ${steps.discover-smp.outputs.smpBaseUrl}
      path: /iso6523-actorid-upis::9915:receiver/services/invoice?mode=malformed
    expect:
      status: 200
      outcome: INVALID_METADATA
      contains: [Malformed SMP XML]
