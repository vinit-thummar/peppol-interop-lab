apiVersion: peppol-interop-lab/v1alpha1
kind: Scenario
metadata:
  name: phoss-ap-outbound-submit-status
  description: Submits a raw UBL document through phoss AP and reads its persisted status
  tags: [as4, phoss, ap, outbound, credentials-required]
specifications: { smp: "1.4.0", as4: "2.0.3", sbdh: "2.0.2" }
requires: [AP_SUBMIT, TRANSACTION_STATUS, EVIDENCE]
steps:
  - id: submit-outbound-invoice
    target: phoss-ap
    action: phoss.submit
    with:
      senderId: iso6523-actorid-upis::9915:interop-lab-sender
      receiverId: iso6523-actorid-upis::9915:interop-lab-receiver
      documentTypeId: busdox-docid-qns::urn:oasis:names:specification:ubl:schema:xsd:Invoice-2::Invoice##urn:cen.eu:en16931:2017#compliant#urn:fdc:peppol.eu:2017:poacc:billing:3.0::2.1
      processId: cenbii-procid-ubl::urn:fdc:peppol.eu:2017:poacc:billing:01:1.0
      countryCode: IN
      sbdhInstanceID: 00000000-0000-4000-8000-000000000001
      custom1: peppol-interop-lab
      payloadFile: examples/phoss-ap/payloads/invoice.xml
      timeoutMs: 30000
    expect: { status: 200, outcome: SUCCESS }
  - id: read-outbound-status
    target: phoss-ap
    action: phoss.status
    with:
      instanceId: 00000000-0000-4000-8000-000000000001
      includeArchive: true
      timeoutMs: 10000
    expect:
      status: 200
      outcome: SUCCESS
      contains: ["00000000-0000-4000-8000-000000000001"]
