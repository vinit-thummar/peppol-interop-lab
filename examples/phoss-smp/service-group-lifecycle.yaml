apiVersion: peppol-interop-lab/v1alpha1
kind: Scenario
metadata:
  name: phoss-smp-service-group-lifecycle
  description: Provisions, reads, and removes a Peppol service group through the phoss SMP publisher API
  tags: [smp, phoss, provisioning, local]
specifications: { smp: "1.4.0", as4: "2.0.3", sbdh: "2.0.2" }
requires: [SMP_PROVISION]
steps:
  - id: provision-service-group
    target: phoss-smp
    action: smp.service-group.put
    with:
      participantScheme: iso6523-actorid-upis
      participantValue: 9915:interop-lab-stage3
      createInSml: false
    expect:
      status: 200
      outcome: SUCCESS
  - id: read-service-group
    target: phoss-smp
    action: smp.service-group.get
    with:
      participantScheme: iso6523-actorid-upis
      participantValue: 9915:interop-lab-stage3
    expect:
      status: 200
      outcome: SUCCESS
      contains: [ServiceGroup, 9915:interop-lab-stage3]
  - id: delete-service-group
    target: phoss-smp
    action: smp.service-group.delete
    with:
      participantScheme: iso6523-actorid-upis
      participantValue: 9915:interop-lab-stage3
      deleteInSml: false
    expect:
      status: 200
      outcome: SUCCESS
  - id: verify-removal
    target: phoss-smp
    action: smp.service-group.get
    with:
      participantScheme: iso6523-actorid-upis
      participantValue: 9915:interop-lab-stage3
    expect:
      status: 404
      outcome: HTTP_ERROR
